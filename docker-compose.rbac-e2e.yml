x-rbac-environment: &rbac-environment
  INTEGRATION_DATABASE_URL: postgresql+psycopg://integration:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/integration
  INTEGRATION_JOB_MODE: celery
  INTEGRATION_BROKER_URL: redis://valkey:6379/0
  INTEGRATION_RESULT_BACKEND: redis://valkey:6379/1
  INTEGRATION_AUTH_REQUIRED: "true"
  INTEGRATION_AUTH_BACKEND: database
  INTEGRATION_AUTH_TOKENS: ""
  PYTHONPATH: /suite/000shared-integration/src

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: integration
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: integration
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U integration -d integration"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.1-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    image: longyuan/integration-gateway:${INTEGRATION_IMAGE_TAG:-rbac-e2e}
    build:
      context: ..
      dockerfile: 000shared-integration/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${E2E_PYTHON_BASE_IMAGE:-python:3.12-slim}
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    environment: *rbac-environment
    volumes:
      - ./src/shared_integration:/suite/000shared-integration/src/shared_integration:ro
      - ./migrations:/suite/000shared-integration/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: longyuan/integration-gateway:${INTEGRATION_IMAGE_TAG:-rbac-e2e}
    build:
      context: ..
      dockerfile: 000shared-integration/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${E2E_PYTHON_BASE_IMAGE:-python:3.12-slim}
    command: ["python", "-m", "shared_integration.gateway"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    environment: *rbac-environment
    volumes:
      - ./src/shared_integration:/suite/000shared-integration/src/shared_integration:ro
      - ./migrations:/suite/000shared-integration/migrations:ro
    ports:
      - "127.0.0.1:${E2E_GATEWAY_HOST_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/livez', timeout=3)
      interval: 3s
      timeout: 5s
      start_period: 10s
      retries: 30
