name: integration-ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: integration-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  # shared-llm-core is a Poetry path dependency (../000shared-llm-core), so both
  # repositories are checked out side by side under this directory.
  SUITE_DIR: ${{ github.workspace }}/suite

jobs:
  pytest:
    name: pytest (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out integration gateway
        uses: actions/checkout@v7
        with:
          path: suite/000shared-integration
          persist-credentials: false

      - name: Check out shared core
        uses: actions/checkout@v7
        with:
          repository: longyuanai/000shared-llm-core
          path: suite/000shared-llm-core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: suite/*/pyproject.toml

      - name: Install project and test tooling
        shell: bash
        run: |
          set -euo pipefail
          # Only the gateway is requested; shared-llm-core arrives once via the
          # Poetry path dependency (requesting it too makes pip abort with
          # ResolutionImpossible, see core's inspect.yml).
          python -m pip install -e "$SUITE_DIR/000shared-integration"
          python -m pip install "pytest>=8.2" pytest-asyncio pytest-mock

      - name: Run test suite
        working-directory: suite/000shared-integration
        run: >-
          python -m pytest tests
          --basetemp="$RUNNER_TEMP/pytest-integration"
          -o addopts=
          -p no:cacheprovider
          -q -rs

      - name: Migrate a fresh SQLite database to head
        working-directory: suite/000shared-integration
        shell: bash
        env:
          INTEGRATION_DATABASE_URL: sqlite+pysqlite:///${{ runner.temp }}/alembic-ci.sqlite3
        run: |
          set -euo pipefail
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic current

  migrations-postgres:
    name: Alembic + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway credentials for the ephemeral CI service container only.
          POSTGRES_USER: integration
          POSTGRES_PASSWORD: integration-ci
          POSTGRES_DB: integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U integration -d integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      INTEGRATION_DATABASE_URL: postgresql+psycopg://integration:integration-ci@localhost:5432/integration
      INTEGRATION_TEST_POSTGRES_URL: postgresql+psycopg://integration:integration-ci@localhost:5432/integration

    steps:
      - name: Check out integration gateway
        uses: actions/checkout@v7
        with:
          path: suite/000shared-integration
          persist-credentials: false

      - name: Check out shared core
        uses: actions/checkout@v7
        with:
          repository: longyuanai/000shared-llm-core
          path: suite/000shared-llm-core
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: suite/*/pyproject.toml

      - name: Install project and test tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e "$SUITE_DIR/000shared-integration"
          python -m pip install "pytest>=8.2" pytest-asyncio pytest-mock

      - name: alembic upgrade head
        working-directory: suite/000shared-integration
        run: python -m alembic upgrade head

      - name: Verify models match migrations
        working-directory: suite/000shared-integration
        run: python -m alembic check

      - name: Downgrade to base and upgrade again
        working-directory: suite/000shared-integration
        shell: bash
        run: |
          set -euo pipefail
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic current

      - name: Run PostgreSQL integration tests
        working-directory: suite/000shared-integration
        run: >-
          python -m pytest tests/test_postgres_integration.py
          --basetemp="$RUNNER_TEMP/pytest-postgres"
          -o addopts=
          -p no:cacheprovider
          -q -rs
